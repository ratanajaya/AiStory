<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="AI Story logo">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0e1014" stroke="#2d3244" stroke-width="1.5"/>

  <!-- Left page of open book -->
  <path d="M13 51 L11 24 L32 20 L32 51 Z"
        fill="#171a21" stroke="#c4c9d4" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right page of open book -->
  <path d="M32 20 L53 24 L51 51 L32 51 Z"
        fill="#141720" stroke="#b2b8c4" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Center spine shadow -->
  <line x1="32" y1="20" x2="32" y2="51" stroke="#363d52" stroke-width="2"/>

  <!-- Text lines — left page (slightly angled to match page perspective) -->
  <line x1="16" y1="31" x2="29" y2="29.5" stroke="#6d7385" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="16" y1="37" x2="29" y2="35.5" stroke="#6d7385" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="16" y1="43" x2="26" y2="41.8" stroke="#6d7385" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Text lines — right page -->
  <line x1="35" y1="29.5" x2="48" y2="31" stroke="#5c6275" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="35" y1="35.5" x2="48" y2="37" stroke="#5c6275" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="35" y1="41.8" x2="46" y2="43" stroke="#5c6275" stroke-width="1.3" stroke-linecap="round"/>

  <!-- 4-pointed AI sparkle centered at (32, 11) — outer radius 6, inner radius 2.5 -->
  <!-- Outer: top(32,5) right(38,11) bottom(32,17) left(26,11) -->
  <!-- Inner: (33.77,9.23) (33.77,12.77) (30.23,12.77) (30.23,9.23) -->
  <path d="M32 5 L33.77 9.23 L38 11 L33.77 12.77 L32 17 L30.23 12.77 L26 11 L30.23 9.23 Z"
        fill="#edf0f6"/>

  <!-- Small flanking dots for sparkle depth -->
  <circle cx="22.5" cy="12.5" r="1.1" fill="#edf0f6" opacity="0.28"/>
  <circle cx="41.5" cy="12.5" r="1.1" fill="#edf0f6" opacity="0.28"/>
</svg>
